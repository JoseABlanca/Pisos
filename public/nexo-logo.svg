<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Light purple/blue for top facets -->
    <linearGradient id="grad-top-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Mid blue/indigo for left pillar -->
    <linearGradient id="grad-left-pillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#555BE1" />
    </linearGradient>

    <!-- Deep indigo for diagonal -->
    <linearGradient id="grad-diagonal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555BE1" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Very dark purple/indigo for right pillar -->
    <linearGradient id="grad-right-pillar" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
  </defs>

  <g transform="translate(60, 60) scale(0.7)">
    <!-- Left vertical segment -->
    <path d="M40,160 L40,320 L120,280 L120,120 Z" fill="url(#grad-left-pillar)" />
    
    <!-- Top-left slant -->
    <path d="M40,160 L120,120 L180,80 L100,120 Z" fill="url(#grad-top-facet)" />
    <path d="M40,160 L120,120 L200,80 L120,120 Z" fill="url(#grad-top-facet)" opacity="0.8"/>
    <polygon points="40,160 120,120 200,160 120,200" fill="url(#grad-top-facet)"/>
    
    <!-- Diagonal segment crossing the middle -->
    <path d="M120,200 L120,120 L280,240 L280,320 Z" fill="url(#grad-diagonal)" />
    
    <!-- Right vertical segment -->
    <path d="M280,240 L280,80 L360,120 L360,280 Z" fill="url(#grad-right-pillar)" />
    
    <!-- Bottom-right slant -->
    <polygon points="200,240 280,200 360,240 280,280" fill="#3730A3"/>
    
    <!-- Facet details to add the 3D 'folded' effect -->
    <polygon points="120,120 200,160 280,240 200,200" fill="url(#grad-left-pillar)" opacity="0.9"/>
    
    <polygon points="120,280 200,240 280,320 200,360" fill="#1E1B4B" />
    <polygon points="40,320 120,280 200,360 120,400" fill="#312E81" />
  </g>
</svg>
